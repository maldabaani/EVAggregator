services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: evagg
      POSTGRES_PASSWORD: evagg
      POSTGRES_DB: evagg
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evagg -d evagg"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.10-alpine
    command: ["-js"]
    ports:
      - "4222:4222"
      - "8222:8222"

  migrate:
    build:
      context: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: &backend_env
      EVAGG_APP_MODE: testing
      EVAGG_DATABASE_URL: postgresql+asyncpg://evagg_app:evagg_app@postgres:5432/evagg
      EVAGG_SUPERADMIN_DATABASE_URL: postgresql+asyncpg://evagg_superadmin:evagg_superadmin@postgres:5432/evagg
      EVAGG_MIGRATION_DATABASE_URL: postgresql+asyncpg://evagg:evagg@postgres:5432/evagg
      EVAGG_REDIS_URL: redis://redis:6379/0
      EVAGG_NATS_URL: nats://nats:4222
    depends_on:
      postgres:
        condition: service_healthy

  backend-main:
    build:
      context: ./backend
      args:
        APP_MODULE: evagg.main:app
    ports:
      - "8000:8000"
    environment: *backend_env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  backend-edge:
    build:
      context: ./backend
      args:
        APP_MODULE: evagg.edge_app:app
    ports:
      - "8090:8000"
    environment: *backend_env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  portal:
    build:
      context: ./portal
    ports:
      - "4200:80"
    depends_on:
      - backend-main

volumes:
  pgdata:
