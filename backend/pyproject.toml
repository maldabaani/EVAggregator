[project]
name = "evagg"
version = "0.1.0"
description = "EV Charging Aggregator Platform backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.139.0",
    "uvicorn[standard]==0.51.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "sqlalchemy==2.0.51",
    "asyncpg==0.31.0",
    "alembic==1.18.5",
    "redis==8.0.1",
    "nats-py==2.15.0",
    "pyjwt[crypto]==2.13.0",
    "python-multipart==0.0.32",
    "websockets==16.1",
    "httpx==0.28.1",
    "prometheus-client==0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "aiosqlite>=0.20",
    "ruff>=0.5",
    "mypy>=1.10",
    "fakeredis>=2.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/unit"]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
