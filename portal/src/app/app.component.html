<header class="top-bar">
  <a routerLink="/dashboard" class="top-bar__brand">
    <span class="top-bar__logo" aria-hidden="true">⚡</span>
    <span>EVAggregator</span>
  </a>
  <nav class="top-bar__nav">
    <a
      *ngFor="let link of navLinks"
      [routerLink]="link.path"
      routerLinkActive="top-bar__link--active"
      class="top-bar__link"
      >{{ link.label }}</a
    >
  </nav>
</header>

<main class="app-shell">
  <router-outlet />
</main>
