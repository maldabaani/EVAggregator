server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # OCPI + the OCPI admin API (partners, reconciliation, session
    # bindings) live on backend-edge and carry no gateway-signed tenant
    # header requirement, so they're proxied straight through.
    location /ocpi/ {
        proxy_pass http://backend-edge:8000;
        proxy_set_header Host $host;
    }

    location /admin/ocpi/ {
        proxy_pass http://backend-edge:8000;
        proxy_set_header Host $host;
    }

    # Tariffs, cost-report, and chargers/.../commands live on backend-main,
    # which requires a gateway-signed X-Tenant-Id — routed through the
    # `gateway` service's dev-mode forwarder instead (evagg/gateway_app.py),
    # not straight to backend-main. The Angular services for these pages
    # send X-Dev-Tenant-Id, which nginx passes through unchanged; the
    # forwarder reads it, signs it, and forwards on.
    location /admin/tariffs {
        proxy_pass http://gateway:8000;
        proxy_set_header Host $host;
    }

    location /admin/teams/ {
        proxy_pass http://gateway:8000;
        proxy_set_header Host $host;
    }

    location /admin/chargers/ {
        proxy_pass http://gateway:8000;
        proxy_set_header Host $host;
    }

    # Angular client-side routing: unknown paths fall back to index.html
    # rather than a raw 404 from nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
