name: portal-ci

on:
  push:
    branches: [main]
    paths: ["portal/**", ".github/workflows/portal-ci.yml"]
  pull_request:
    paths: ["portal/**", ".github/workflows/portal-ci.yml"]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: portal/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false --browsers=ChromeHeadlessNoSandbox --code-coverage
      - run: npx ng build
