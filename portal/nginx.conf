server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # OCPI + the OCPI admin API (partners, reconciliation, session
    # bindings) live on backend-edge and carry no gateway-signed tenant
    # header requirement, so they can be proxied straight through. Routes
    # backed by backend-main (tariffs, cost-report, chargers/.../commands)
    # are NOT proxied here: they require GatewaySignatureMiddleware's
    # signed X-Tenant-Id header, which nothing in this stack issues yet —
    # see docs/production_readiness.md.
    location /ocpi/ {
        proxy_pass http://backend-edge:8000;
        proxy_set_header Host $host;
    }

    location /admin/ocpi/ {
        proxy_pass http://backend-edge:8000;
        proxy_set_header Host $host;
    }

    # Angular client-side routing: unknown paths fall back to index.html
    # rather than a raw 404 from nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
