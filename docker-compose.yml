services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: evagg
      POSTGRES_PASSWORD: evagg
      POSTGRES_DB: evagg
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evagg -d evagg"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: &backend_env
      EVAGG_APP_MODE: testing
      EVAGG_DATABASE_URL: postgresql+asyncpg://evagg_app:evagg_app@postgres:5432/evagg
      EVAGG_SUPERADMIN_DATABASE_URL: postgresql+asyncpg://evagg_superadmin:evagg_superadmin@postgres:5432/evagg
      EVAGG_MIGRATION_DATABASE_URL: postgresql+asyncpg://evagg:evagg@postgres:5432/evagg
      EVAGG_REDIS_URL: redis://redis:6379/0
      EVAGG_NATS_URL: nats://nats:4222
      # memory (default) needs nothing below — set a root-level .env (or
      # export these before `docker compose up`) to point backend-main/
      # backend-edge at Supabase instead. See docs/supabase/schema.sql and
      # docs/production_readiness.md.
      EVAGG_PERSISTENCE_BACKEND: ${EVAGG_PERSISTENCE_BACKEND:-memory}
      EVAGG_SUPABASE_URL: ${EVAGG_SUPABASE_URL:-https://project.supabase.co}
      EVAGG_SUPABASE_API_KEY: ${EVAGG_SUPABASE_API_KEY:-dev_only_replace_me}
    depends_on:
      postgres:
        condition: service_healthy

  backend-main:
    build:
      context: ./backend
      args:
        APP_MODULE: evagg.main:app
    ports:
      - "8000:8000"
    environment: *backend_env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy

  backend-edge:
    build:
      context: ./backend
      args:
        APP_MODULE: evagg.edge_app:app
    ports:
      - "8090:8000"
    environment: *backend_env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy

  # OAuth/PKCE token issuance (Task 6.3) plus, in app_mode=testing only, a
  # dev-mode request forwarder standing in for the login flow the portal
  # never got — signs whatever tenant id the portal states and forwards to
  # backend-main. See evagg/gateway_app.py's module docstring; excluded
  # entirely in app_mode=production.
  gateway:
    build:
      context: ./backend
      args:
        APP_MODULE: evagg.gateway_app:app
    ports:
      - "8091:8000"
    environment:
      <<: *backend_env
      EVAGG_INTERNAL_SERVICES_BASE_URL: http://backend-main:8000
    depends_on:
      - backend-main

  portal:
    build:
      context: ./portal
    ports:
      - "4200:80"
    depends_on:
      - backend-main
      - backend-edge
      - gateway

volumes:
  pgdata:
