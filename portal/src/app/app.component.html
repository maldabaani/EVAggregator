<div class="shell" [class.shell--collapsed]="sidebarCollapsed">
  <aside class="sidebar">
    <a routerLink="/dashboard" class="sidebar__brand">
      <span class="sidebar__logo" aria-hidden="true">⚡</span>
      <span class="sidebar__title">EVAggregator</span>
    </a>

    <div class="sidebar__section-label">Operations</div>
    <nav class="sidebar__nav">
      <a routerLink="/dashboard" routerLinkActive="sidebar__link--active" class="sidebar__link" title="Dashboard">
        <svg class="sidebar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3.5" y="3.5" width="7" height="7" rx="1.5" />
          <rect x="13.5" y="3.5" width="7" height="7" rx="1.5" />
          <rect x="3.5" y="13.5" width="7" height="7" rx="1.5" />
          <rect x="13.5" y="13.5" width="7" height="7" rx="1.5" />
        </svg>
        <span class="sidebar__label">Dashboard</span>
      </a>
      <a routerLink="/partners" routerLinkActive="sidebar__link--active" class="sidebar__link" title="Partners">
        <svg class="sidebar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="8.5" cy="8" r="3" />
          <circle cx="16" cy="9" r="2.4" />
          <path d="M3.5 20c0-3 2.2-5 5-5s5 2 5 5" />
          <path d="M14 20c0-2.4 1.6-4 3.8-4s3.7 1.6 3.7 4" />
        </svg>
        <span class="sidebar__label">Partners</span>
      </a>
      <a routerLink="/tariffs" routerLinkActive="sidebar__link--active" class="sidebar__link" title="Tariffs">
        <svg class="sidebar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M11 3.5H5.5a1 1 0 0 0-1 1V10c0 .3.1.5.3.7l9 9a1 1 0 0 0 1.4 0l5-5a1 1 0 0 0 0-1.4l-9-9a1 1 0 0 0-.7-.3Z" />
          <circle cx="8" cy="8" r="1.3" />
        </svg>
        <span class="sidebar__label">Tariffs</span>
      </a>
      <a
        routerLink="/cost-dashboard"
        routerLinkActive="sidebar__link--active"
        class="sidebar__link"
        title="Cost Reports"
      >
        <svg class="sidebar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M4 20V10" />
          <path d="M10.5 20V4" />
          <path d="M17 20v-7" />
          <path d="M3.5 20.5h17" />
        </svg>
        <span class="sidebar__label">Cost Reports</span>
      </a>
      <a routerLink="/commands" routerLinkActive="sidebar__link--active" class="sidebar__link" title="Commands">
        <svg class="sidebar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M13 2 4.5 13.5H11L10 22l8.5-11.5H12l1-8.5Z" stroke-linejoin="round" />
        </svg>
        <span class="sidebar__label">Commands</span>
      </a>
    </nav>

    <button type="button" class="sidebar__collapse-toggle" (click)="toggleSidebar()" aria-label="Toggle sidebar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path [attr.d]="sidebarCollapsed ? 'M9 5l7 7-7 7' : 'M15 5l-7 7 7 7'" />
      </svg>
    </button>
  </aside>

  <div class="shell__main">
    <header class="top-bar">
      <h1 class="top-bar__title">{{ pageTitle }}</h1>
      <button
        type="button"
        class="icon-button"
        (click)="toggleTheme()"
        [attr.aria-label]="theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
        data-testid="theme-toggle"
      >
        {{ theme === 'dark' ? '☀️' : '🌙' }}
      </button>
    </header>

    <main class="app-shell">
      <router-outlet />
    </main>
  </div>
</div>
